name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: rishikeshdev-code
          outputs: |
            dist/github-snake.svg?palette=["#001a00","#004d00","#008000","#00cc00","#00ff00"]
            dist/github-snake-dark.svg?palette=["#001a00","#004d00","#008000","#00cc00","#00ff00"]

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
